    <rect x="35" y="16" width="3" height="8" fill="#f472b6"/>
    
    <!-- Soft Pastel Highlights -->
    <rect x="19" y="13" width="2" height="3" fill="#fff1f2"/>
    <rect x="25" y="9" width="2" height="4" fill="#ffffff"/>
    <rect x="31" y="11" width="2" height="3" fill="#fff1f2"/>
