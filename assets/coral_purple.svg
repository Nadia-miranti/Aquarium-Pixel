<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 48" shape-rendering="crispEdges">
    <!-- Rock Base -->
    <rect x="4" y="38" width="36" height="10" fill="#44403c"/>
    <rect x="8" y="34" width="28" height="6" fill="#57534e"/>
    <rect x="12" y="32" width="20" height="4" fill="#78716c"/>
    
    <!-- Tube 1 (Left Tall) -->
    <rect x="10" y="14" width="6" height="20" fill="#7e22ce"/>
    <rect x="11" y="12" width="5" height="22" fill="#a855f7"/>
    <rect x="12" y="10" width="4" height="24" fill="#c084fc"/>
    <!-- Opening -->
    <rect x="11" y="9" width="5" height="3" fill="#d8b4fe"/>
    <rect x="12" y="8" width="3" height="2" fill="#fef08a"/>
    
    <!-- Tube 2 (Center Medium) -->
    <rect x="18" y="18" width="7" height="16" fill="#7e22ce"/>
    <rect x="19" y="16" width="6" height="18" fill="#a855f7"/>
    <rect x="20" y="14" width="4" height="20" fill="#c084fc"/>
    <!-- Opening -->
    <rect x="19" y="13" width="6" height="3" fill="#d8b4fe"/>
    <rect x="20" y="12" width="4" height="2" fill="#fef08a"/>
    
    <!-- Tube 3 (Right Short) -->
    <rect x="27" y="22" width="6" height="12" fill="#7e22ce"/>
    <rect x="28" y="20" width="5" height="14" fill="#a855f7"/>
    <rect x="29" y="18" width="4" height="16" fill="#c084fc"/>
    <!-- Opening -->
    <rect x="28" y="17" width="5" height="3" fill="#d8b4fe"/>
    <rect x="29" y="16" width="3" height="2" fill="#fef08a"/>
    
    <!-- Pearl/Shell Detail on rock -->
    <rect x="34" y="36" width="4" height="4" fill="#fbcfe8"/>
    <rect x="35" y="37" width="2" height="2" fill="#ffffff"/>
  </svg>