<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 24" shape-rendering="crispEdges">
    <!-- Outline -->
    <rect x="6" y="5" width="20" height="14" fill="#431407"/>
    <rect x="24" y="7" width="7" height="10" fill="#431407"/>
    <rect x="12" y="2" width="10" height="4" fill="#431407"/>
    <rect x="13" y="18" width="8" height="4" fill="#431407"/>
    
    <!-- Body Orange -->
    <rect x="7" y="6" width="18" height="12" fill="#ea580c"/>
    <rect x="8" y="7" width="16" height="10" fill="#f97316"/>
    <rect x="9" y="8" width="14" height="8" fill="#fb923c"/>
    
    <!-- Tail Fin -->
    <rect x="25" y="8" width="4" height="8" fill="#f97316"/>
    <rect x="29" y="7" width="2" height="10" fill="#0f172a"/>
    <rect x="28" y="8" width="1" height="8" fill="#ffffff"/>
    
    <!-- Stripe 1 (Head) -->
    <rect x="10" y="5" width="4" height="14" fill="#0f172a"/>
    <rect x="11" y="6" width="2" height="12" fill="#ffffff"/>
    
    <!-- Stripe 2 (Mid Body) -->
    <rect x="17" y="3" width="4" height="18" fill="#0f172a"/>
    <rect x="18" y="4" width="2" height="16" fill="#ffffff"/>
    
    <!-- Stripe 3 (Tail Base) -->
    <rect x="23" y="7" width="3" height="10" fill="#0f172a"/>
    <rect x="24" y="8" width="1" height="8" fill="#ffffff"/>
    
    <!-- Fins -->
    <rect x="13" y="3" width="8" height="2" fill="#f97316"/>
    <rect x="14" y="18" width="6" height="2" fill="#f97316"/>
    <rect x="13" y="11" width="4" height="4" fill="#c2410c"/>
    <rect x="14" y="12" width="2" height="2" fill="#ffffff"/>
    
    <!-- Eye & Snout -->
    <rect x="7" y="8" width="3" height="3" fill="#0f172a"/>
    <rect x="7" y="8" width="1" height="1" fill="#ffffff"/>
    <rect x="4" y="11" width="3" height="3" fill="#c2410c"/>
  </svg>